<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src ipc: http://ipc.localhost">
<title>Vgent</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#151517;color:#eee}body{margin:0;display:grid;place-items:center;height:100vh}.card{width:min(420px,80vw)}h1{font-size:28px;font-weight:600;letter-spacing:-1px}p{color:#aaa;font-size:14px;line-height:1.8;overflow-wrap:anywhere}progress{width:100%;height:5px;accent-color:#a5b4fc}button{background:#eee;color:#151517;border:0;border-radius:8px;padding:10px 18px;font:inherit;cursor:pointer}small{display:block;margin-top:20px;color:#777;line-height:1.8}
</style>
<body><main class="card"><h1>Vgent</h1><p id="message" role="status">正在准备内置工作台…</p><progress id="progress"></progress><p id="size"></p><button id="retry" hidden>重试安装</button><small>工作台已内置，首次打开会在本机解压，无需下载。准备完成后自动进入工作台，后续启动直接使用本地缓存。</small></main>
<script>
const message=document.getElementById('message'),progress=document.getElementById('progress'),size=document.getElementById('size'),retry=document.getElementById('retry');
async function refresh(){try{const s=await window.__TAURI__.core.invoke('runtime_status');message.textContent=s.message;retry.hidden=s.phase!=='error';progress.hidden=s.phase==='error';if(s.total){progress.max=s.total;progress.value=s.downloaded;size.textContent=`${(s.downloaded/1048576).toFixed(1)} / ${(s.total/1048576).toFixed(1)} MB`;}else{progress.removeAttribute('value');size.textContent='';}}catch(e){message.textContent=String(e);}setTimeout(refresh,400);}
retry.onclick=async()=>{retry.hidden=true;await window.__TAURI__.core.invoke('runtime_retry');};refresh();
</script></body></html>
