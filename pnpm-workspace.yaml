packages:
  - "packages/*"
  - "apps/*"
# Provider-defined tool schemas use shared symbol types; keep SDK packages on one copy.
overrides:
  # harness-opencode pins ws exactly; without this it pulls a second copy of @ai-sdk/harness.
  '@ai-sdk/harness-opencode>ws': '8.21.3'
  '@ai-sdk/provider-utils': '5.0.45'
patchedDependencies:
  '@ai-sdk/harness-claude-code@1.0.125': patches/@ai-sdk__harness-claude-code@1.0.125.patch
  '@ai-sdk/harness-opencode@1.0.123': patches/@ai-sdk__harness-opencode@1.0.123.patch
  '@ai-sdk/harness@1.0.121': patches/@ai-sdk__harness@1.0.121.patch
